# Fichero de respaldo para Certbot DNS-01 con Cloudflare.
# El despliegue recomendado define CLOUDFLARE_API_TOKEN en .env.
# Si esa variable existe, certbot/certbot-renew.sh genera credenciales
# temporales dentro del contenedor y este fichero no se usa.
#
# Si necesitas usar este fichero en vez de .env, descomenta la linea:
# dns_cloudflare_api_token = REPLACE_WITH_CLOUDFLARE_DNS_API_TOKEN

